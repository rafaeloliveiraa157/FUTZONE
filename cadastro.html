<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutZone - Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>
            <img src="./fotosfutzone/futzone.jpg" alt="Logo FutZone" width="50">
            FUTZONE
        </h1>
        <p>Faça parte do nosso time!</p>
    </header>

    <nav>
        <a href="index.html">Início</a>
        <a href="produtos.html">Produtos</a>
        <a href="cadastro.html">Cadastro</a>
        <a href="login.html">Login</a>
        <a href="quem-somos.html">Quem Somos</a>
    </nav>

    <main>
        <h2>Cadastro de Cliente</h2>

        <form action="#" method="post" enctype="multipart/form-data">

            <label for="nome">Nome completo:</label><br>
            <input type="text" id="nome" name="nome" minlength="3" required>
            <br><br>

            <label for="email">E-mail:</label><br>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="celular">Celular:</label><br>
            <input type="tel" id="celular" name="celular"
                   pattern="[0-9]{2} [0-9]{5}-[0-9]{4}"
                   title="Digite no formato 11 99999-9999"
                   placeholder="11 99999-9999" required>
            <br><br>

            <p>Qual é o seu time do coração?</p>

            <input type="radio" id="palmeiras" name="time" value="Palmeiras">
            <label for="palmeiras">Palmeiras</label><br>

            <input type="radio" id="corinthians" name="time" value="Corinthians">
            <label for="corinthians">Corinthians</label><br>

            <input type="radio" id="saopaulo" name="time" value="São Paulo">
            <label for="saopaulo">São Paulo</label><br>

            <input type="radio" id="flamengo" name="time" value="Flamengo">
            <label for="flamengo">Flamengo</label><br>

            <input type="radio" id="outro" name="time" value="Outro">
            <label for="outro">Outro</label><br><br>

            <p>Quais produtos você gosta?</p>

            <input type="checkbox" id="camisas" name="produtos[]" value="Camisas">
            <label for="camisas">Camisas</label><br>

            <input type="checkbox" id="chuteiras" name="produtos[]" value="Chuteiras">
            <label for="chuteiras">Chuteiras</label><br>

            <input type="checkbox" id="bolas" name="produtos[]" value="Bolas">
            <label for="bolas">Bolas</label><br>

            <input type="checkbox" id="acessorios" name="produtos[]" value="Acessórios">
            <label for="acessorios">Acessórios</label><br><br>

            <label for="estado">Estado (UF):</label><br>
            <select id="estado" name="estado" required>
                <option value="">Selecione seu estado</option>
                <option value="SP">São Paulo</option>
                <option value="RJ">Rio de Janeiro</option>
                <option value="MG">Minas Gerais</option>
                <option value="PR">Paraná</option>
                <option value="SC">Santa Catarina</option>
                <option value="RS">Rio Grande do Sul</option>
            </select>
            <br><br>

            <label for="documento">Enviar documento (opcional):</label><br>
            <input type="file" id="documento" name="documento"
                   accept=".pdf,.png,.jpeg,.jpg">
            <br><br>

            <label for="mensagem">Mensagem ou comentário:</label><br>
            <textarea id="mensagem" name="mensagem" rows="5" cols="35"></textarea>
            <br><br>

            <input type="checkbox" id="termos" name="termos" required>
            <label for="termos">Aceito os termos do cadastro.</label>
            <br><br>

            <button type="submit">Enviar Cadastro</button>
            <button type="reset">Limpar</button>

        </form>
    </main>

    <footer>
        <p>FutZone © 2026 - Todos os direitos reservados.</p>
        <p>Instagram: @futzone | Contato: contato@futzone.com</p>
    </footer>

</body>
</html>
